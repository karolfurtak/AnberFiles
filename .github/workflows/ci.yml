name: CI
run-name: "CI ${{ github.ref_name }}: ${{ github.event.head_commit.message || github.event.pull_request.title }}"
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Zależności (przypięte, ze skrótami sha256) i narzędzia
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Audyt zależności (znane podatności)
        run: pip-audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off
      - run: ruff check --select E9,F app/ tools/ tests/ narzedzia/anberfiles-reset-hasla
      - run: python -m py_compile app/server.py app/konfiguracja.py app/logowanie.py app/przesluchania.py app/nagrania.py app/odswiezanie.py tools/czytaj_tts.py tools/czas_z_gita.py narzedzia/anberfiles-reset-hasla
      - name: Składnia skryptów sh
        run: for f in narzedzia/anberfiles-kopia-plikow narzedzia/anberfiles-odswiez; do sh -n "$f"; done

  testy:
    name: testy (${{ matrix.instancja }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - instancja: anbernic
            python: '3.10'
          - instancja: jarvis
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Zależności (przypięte, ze skrótami sha256) i narzędzia
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Ustawienia instancji Jarvis (przykład z katalogami tymczasowymi)
        if: matrix.instancja == 'jarvis'
        run: |
          BAZA="$RUNNER_TEMP/anberfiles"
          mkdir -p "$BAZA/korzen/lektor" "$BAZA/dane" "$BAZA/eksport"
          sed "s#/srv/anberfiles#$BAZA#g" konfiguracja/jarvis.conf.przyklad > "$RUNNER_TEMP/jarvis.conf"
          echo "ANBERFILES_CONF=$RUNNER_TEMP/jarvis.conf" >> "$GITHUB_ENV"
          echo "SERVER_PASS=ci-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - name: Testy
        run: python -m pytest tests -v
      - name: Start serwera na ustawieniach instancji (formularz — ustaw hasło, ciasteczko, 401 bez niego)
        if: matrix.instancja == 'jarvis'
        run: |
          SERVER_PASS= python app/server.py > "$RUNNER_TEMP/serwer.log" 2>&1 &
          PID=$!
          U=http://127.0.0.1:8790
          for i in $(seq 1 30); do curl -s -o /dev/null $U/ && break; sleep 0.5; done
          EKRAN=$(curl -s -H 'Accept: text/html' $U/)
          echo "$EKRAN" | grep -q 'name="powtorz"' || { echo "BŁĄD: brak ekranu Ustaw hasło"; kill $PID; exit 1; }
          H="ci-haslo-$GITHUB_RUN_ID"
          # bez tokenu startowego → 403; token (jednorazowy) tylko w dzienniku serwera
          BEZTOK=$(curl -s -o /dev/null -w '%{http_code}' --data-urlencode "haslo=$H" --data-urlencode "powtorz=$H" $U/__anberfiles/ustaw-haslo)
          TOK=$(grep -o 'ustaw-haslo?token=[A-Za-z0-9_-]*' "$RUNNER_TEMP/serwer.log" | head -1 | cut -d= -f2)
          test -n "$TOK" || { echo "BŁĄD: brak tokenu startowego w dzienniku"; cat "$RUNNER_TEMP/serwer.log"; kill $PID; exit 1; }
          # formularz ponad 4 KiB → 413 przed wczytaniem
          DUZY=$(head -c 1100000 /dev/zero | tr '\0' x | curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' --data-binary @- $U/__anberfiles/ustaw-haslo)
          UST=$(curl -s -o /dev/null -w '%{http_code}' -c "$RUNNER_TEMP/c.txt" --data-urlencode "token=$TOK" --data-urlencode "haslo=$H" --data-urlencode "powtorz=$H" $U/__anberfiles/ustaw-haslo)
          Z=$(curl -s -o /dev/null -w '%{http_code}' -b "$RUNNER_TEMP/c.txt" $U/)
          BEZ=$(curl -s -o /dev/null -w '%{http_code}' $U/)
          ZLE=$(curl -s -o /dev/null -w '%{http_code}' --data-urlencode "haslo=zle-haslo-000" $U/__anberfiles/zaloguj)
          # B9: obca nazwa w Host → 421; POST zmieniający stan bez X-AnberFiles → 403, z nim → 200
          OBCY=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' -b "$RUNNER_TEMP/c.txt" $U/)
          BEZNAG=$(curl -s -o /dev/null -w '%{http_code}' -X POST -b "$RUNNER_TEMP/c.txt" "$U/?lektorqresume=1")
          ZNAG=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-AnberFiles: 1' -b "$RUNNER_TEMP/c.txt" "$U/?lektorqresume=1")
          kill $PID; cat "$RUNNER_TEMP/serwer.log"
          echo "bez tokenu: $BEZTOK, 1 MB: $DUZY, ustawienie z tokenem: $UST, z ciasteczkiem: $Z, bez: $BEZ, złe hasło: $ZLE"
          echo "obcy Host: $OBCY, POST bez nagłówka: $BEZNAG, z nagłówkiem: $ZNAG"
          ls -l "$RUNNER_TEMP/anberfiles/dane/auth"
          test "$BEZTOK" = 403 && test "$DUZY" = 413
          test "$UST" = 303 && test "$Z" = 200 && test "$BEZ" = 401 && test "$ZLE" = 401
          test "$OBCY" = 421 && test "$BEZNAG" = 403 && test "$ZNAG" = 200
          ! grep -rq "$H" "$RUNNER_TEMP/anberfiles/dane"
      - name: Odmowa startu bez hasła (logowanie basic)
        if: matrix.instancja == 'jarvis'
        run: |
          sed 's/^logowanie *=.*/logowanie = basic/' "$ANBERFILES_CONF" > "$RUNNER_TEMP/jarvis-basic.conf"
          set +e
          ANBERFILES_CONF="$RUNNER_TEMP/jarvis-basic.conf" SERVER_PASS= timeout 20 python app/server.py 2> "$RUNNER_TEMP/err.log"
          RC=$?
          set -e
          cat "$RUNNER_TEMP/err.log"
          echo "kod wyjścia: $RC"
          if [ "$RC" = 0 ] || [ "$RC" = 124 ]; then
            echo "BŁĄD: serwer wystartował bez hasła"; exit 1
          fi
          grep "Brak hasła" "$RUNNER_TEMP/err.log"
